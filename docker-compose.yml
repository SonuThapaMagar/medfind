services:
  db:
    image: postgres:15
    container_name: medfind_db
    restart: always
    environment:
      POSTGRES_USER: medfind
      POSTGRES_PASSWORD: password
      POSTGRES_DB: medfind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
